name: Keep Supabase Alive

on:
  schedule:
    # Mengatur jadwal berjalan tiap 3 hari sekali agar aman dari batas 7 hari
    - cron: '0 0 */3 * *' 
  workflow_dispatch: # Tombol untuk menjalankan manual kapan saja

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          curl -f -s -o /dev/null -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/rate_limits?select=count&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
